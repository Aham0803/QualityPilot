version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dq_steward_postgres
    environment:
      POSTGRES_USER: steward_user
      POSTGRES_PASSWORD: steward_password
      POSTGRES_DB: dq_steward_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward_user -d dq_steward_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: dq_steward_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://steward_user:steward_password@postgres:5432/dq_steward_db
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  pgdata:
